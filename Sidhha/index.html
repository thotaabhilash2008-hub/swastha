<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siddha — Swastha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-primary: #07170F;
      --bg-secondary: #103B28;
      --botanical: #47734C;
      --gold: #C8A45D;
      --gold-warm: #E5C783;
      --ivory: #F5F0E4;
      --sage: #C7C9B9;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ivory);
      background: radial-gradient(ellipse at top right, rgba(16, 59, 40, 0.6) 0%, transparent 60%), #07170F;
      font-family: 'Jost', sans-serif;
      text-align: center;
    }
    main {
      max-width: 620px;
      background: rgba(16, 59, 40, 0.45);
      border: 1px solid rgba(200, 164, 93, 0.25);
      border-radius: 6px;
      padding: 60px 40px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .ornament { color: var(--gold-warm); font-size: 24px; margin-bottom: 8px; }
    h1 {
      margin: 12px 0;
      color: var(--ivory);
      font: 300 clamp(42px, 8vw, 72px)/1.1 'Cormorant Garamond', serif;
      letter-spacing: 4px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    p {
      margin: 0;
      color: var(--gold-warm);
      font: 300 clamp(20px, 3.5vw, 26px) 'Cormorant Garamond', serif;
      font-style: italic;
      letter-spacing: 1px;
    }
    a {
      display: inline-block;
      margin-top: 36px;
      color: var(--sage);
      text-decoration: none;
      border-bottom: 1px solid var(--gold);
      padding-bottom: 5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 11px;
      transition: all 0.3s;
    }
    a:hover, a:focus-visible { color: var(--gold-warm); border-color: var(--gold-warm); }
  </style>
</head>
<body>
  <main>
    <div class="ornament" aria-hidden="true">✦</div>
    <h1>Siddha</h1>
    <p>Working in Progress</p>
    <a href="../index.html">← Back to Swastha</a>
  </main>
</body>
</html>
