<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimba | Swastha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="preload" href="neem3d.glb" as="fetch" crossorigin="anonymous">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
    --bg-primary: #07170F;
    --bg-secondary: #103B28;
    --botanical: #47734C;
    --gold: #C8A45D;
    --gold-warm: #E5C783;
    --ivory: #F5F0E4;
    --sage: #C7C9B9;

    --cream: #07170F;
    --parchment: #103B28;
    --earth: #E5C783;
    --forest: #47734C;
    --deep: #F5F0E4;
    --ink: #F5F0E4;
}
    * { margin:0; padding:0; box-sizing:border-box }
    html { scroll-behavior:smooth }
    body {
      font-family:'Jost',sans-serif;
      background:var(--cream);
      color:var(--ink);
      min-height:100vh;
      overflow-x:hidden;
      position:relative
    }
    body::before {
      content:'';
      position:fixed;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity:.035;
      pointer-events:none;
      z-index:100
    }
    #open3D {
      position:fixed; top:25px; right:30px;
      padding:10px 18px; font-size:11px; letter-spacing:2px;
      text-transform:uppercase; background:var(--forest); color:#fff;
      border:none; cursor:pointer; z-index:1000; transition:.3s
    }
    #open3D:hover { background:var(--gold); color:var(--deep) }
    #viewerModal {
      position:fixed; inset:0; z-index:2000;
      display:none; flex-direction:column;
    }
    #modal-topbar {
      flex-shrink:0; height:58px; background:#111;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px 0 32px; border-bottom:1px solid rgba(255,255,255,.07)
    }
    #modal-topbar span {
      font-family:'Jost',sans-serif; font-size:11px; font-weight:300;
      letter-spacing:4.5px; text-transform:uppercase; color:rgba(255,255,255,.72); user-select:none
    }
    #close3D {
      width:38px; height:38px; font-size:15px; font-weight:300;
      background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.7);
      border-radius:50%; cursor:pointer; display:flex; align-items:center;
      justify-content:center; transition:background .2s,color .2s,transform .22s; outline:none
    }
    #close3D:hover { background:#fff; color:#111; border-color:#fff; transform:rotate(90deg) }
    #viewerModal model-viewer { flex:1; width:100%; display:block; background:#fff }
    .bg-circle { position:fixed; border-radius:50%; pointer-events:none; z-index:0 }
    .bg-circle-1 {
      width:700px; height:700px;
      background:radial-gradient(circle, rgba(45,90,39,.12) 0%, transparent 70%);
      top:-200px; right:-150px
    }
    .bg-circle-2 {
      width:500px; height:500px;
      background:radial-gradient(circle, rgba(168,184,75,.09) 0%, transparent 70%);
      bottom:-100px; left:-100px
    }
    .botanical-svg { position:fixed; pointer-events:none; z-index:1; opacity:.09 }
    .botanical-tl { top:-20px; left:-20px; width:280px }
    .botanical-br { bottom:-20px; right:-20px; width:240px; transform:rotate(180deg) }

    /* Neem leaf SVG ornaments */
    .hero { position:relative; z-index:10; padding:54px 40px 0; text-align:center; opacity:0; animation:fadeUp .9s ease .1s forwards }
    .back-link { display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--sage); text-decoration:none; margin-bottom:36px; transition:color .3s }
    .back-link:hover { color:var(--gold) }
    .logo-rule { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:14px }
    .logo-rule span { display:block; height:1px; width:70px; background:linear-gradient(to right, transparent, var(--gold)) }
    .logo-rule span:last-child { background:linear-gradient(to left, transparent, var(--gold)) }
    .logo-ornament { font-size:13px; color:var(--gold) }
    .hero-title { font-family:'Cormorant Garamond',serif; font-size:clamp(64px,12vw,110px); font-weight:300; letter-spacing:8px; line-height:1; color:var(--deep) }
    .hero-subtitle { font-family:'Cormorant Garamond',serif; font-size:18px; font-style:italic; font-weight:300; color:var(--earth); letter-spacing:2px; margin-top:8px }
    .hero-sci { font-size:11px; font-weight:200; letter-spacing:5px; color:var(--sage); margin-top:6px }
    .hero-photos { position:relative; z-index:10; display:grid; grid-template-columns:1fr 1fr; gap:2px; max-width:900px; margin:40px auto 0; opacity:0; animation:fadeUp .9s ease .35s forwards }
    .hero-photos img { width:100%; height:380px; object-fit:cover; object-position:center; display:block; background:var(--parchment) }
    .hero-photos img:first-child { object-position:center 40% }
    .photo-caption { text-align:center; font-family:'Cormorant Garamond',serif; font-size:12px; font-style:italic; color:var(--sage); letter-spacing:1px; padding:10px 0 0; max-width:900px; margin:0 auto; position:relative; z-index:10; opacity:0; animation:fadeUp .9s ease .5s forwards }
    .divider { display:flex; align-items:center; justify-content:center; gap:16px; margin:50px auto; max-width:600px; opacity:0; animation:fadeUp .9s ease .55s forwards; position:relative; z-index:10 }
    .divider-line { height:1px; width:120px; background:linear-gradient(to right, transparent, var(--sage)) }
    .divider-line:last-child { background:linear-gradient(to left, transparent, var(--sage)) }
    .divider-leaf { color:var(--forest); font-size:18px }
    .content { position:relative; z-index:10; max-width:860px; margin:0 auto; padding:0 30px 80px }
    .intro-text { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:300; line-height:1.75; color:var(--ink); text-align:center; max-width:700px; margin:0 auto 60px; opacity:0; animation:fadeUp .9s ease .6s forwards }
    .intro-text em { color:var(--forest); font-style:italic }
    .section { margin-bottom:60px; opacity:0; animation:fadeUp .9s ease forwards }
    .section:nth-child(1){animation-delay:.65s}.section:nth-child(2){animation-delay:.75s}.section:nth-child(3){animation-delay:.85s}.section:nth-child(4){animation-delay:.95s}.section:nth-child(5){animation-delay:1.05s}.section:nth-child(6){animation-delay:1.15s}.section:nth-child(7){animation-delay:1.25s}
    .section-header { display:flex; align-items:center; gap:14px; margin-bottom:20px }
    .section-num { font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:4px; color:var(--gold) }
    .section-title { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:400; color:var(--deep); letter-spacing:1px }
    .section-rule { height:1px; flex:1; background:linear-gradient(to right, var(--gold), transparent) }
    .section-body { font-size:13px; font-weight:300; line-height:1.9; color:var(--ink); margin-bottom:24px }
    .data-table { width:100%; border-collapse:collapse; margin:16px 0 8px; font-size:12px }
    .data-table thead tr { background:var(--deep); color:var(--gold); font-size:10px; letter-spacing:3px; text-transform:uppercase }
    .data-table thead th { padding:12px 14px; text-align:left; font-weight:400 }
    .data-table tbody tr:nth-child(even){background:var(--parchment)}.data-table tbody tr:nth-child(odd){background:var(--cream)}
    .data-table tbody tr { transition:background .2s }
    .data-table tbody tr:hover { background:#d8e6c8 }
    .data-table tbody td { padding:10px 14px; color:var(--ink); border-bottom:1px solid rgba(74,103,65,.08) }
    .data-table tbody td:first-child { font-weight:400; color:var(--deep); width:28% }
    .dosha-table { width:100%; border-collapse:collapse; margin:16px 0; font-size:12px }
    .dosha-table thead tr { background:var(--forest); color:var(--cream) }
    .dosha-table thead th { padding:12px 14px; text-align:left; font-weight:400; letter-spacing:2px; font-size:10px; text-transform:uppercase }
    .dosha-table tbody tr:nth-child(even){background:var(--parchment)}.dosha-table tbody tr:nth-child(odd){background:var(--cream)}
    .dosha-table tbody td { padding:11px 14px; color:var(--ink); border-bottom:1px solid rgba(74,103,65,.08) }
    .dosha-table tbody td:first-child { font-weight:400; color:var(--forest); width:18% }
    .dosha-table tbody td:nth-child(2) { color:var(--earth); width:20% }
    .consume-table { width:100%; border-collapse:collapse; margin:16px 0; font-size:12px }
    .consume-table thead tr { background:var(--earth); color:var(--cream) }
    .consume-table thead th { padding:12px 14px; text-align:left; font-weight:400; letter-spacing:2px; font-size:10px; text-transform:uppercase }
    .consume-table tbody tr:nth-child(even){background:var(--parchment)}.consume-table tbody tr:nth-child(odd){background:var(--cream)}
    .consume-table tbody td { padding:11px 14px; color:var(--ink); border-bottom:1px solid rgba(74,103,65,.08) }
    .consume-table tbody td:first-child { font-weight:400; color:var(--earth); width:22% }
    .benefits-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:rgba(74,103,65,.12); border:1px solid rgba(74,103,65,.12); margin:8px 0 }
    .benefit-card { background:var(--cream); padding:24px 22px; transition:background .3s; position:relative; overflow:hidden }
    .benefit-card:hover { background:#ddebd0 }
    .benefit-card::before { content:''; position:absolute; bottom:0; left:0; width:0; height:2px; background:var(--gold); transition:width .4s }
    .benefit-card:hover::before { width:100% }
    .benefit-title { font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:600; color:var(--forest); margin-bottom:8px }
    .benefit-desc { font-size:11.5px; font-weight:300; line-height:1.75; color:var(--ink); opacity:.85 }
    .precaution-list { list-style:none; margin:8px 0 }
    .precaution-list li { display:flex; gap:12px; align-items:flex-start; padding:10px 14px; font-size:12px; font-weight:300; line-height:1.7; color:var(--ink); border-bottom:1px solid rgba(74,103,65,.08) }
    .precaution-list li:last-child { border-bottom:none }
    .precaution-list li::before { content:'▸'; color:var(--gold); flex-shrink:0; margin-top:1px }
    .sources { border-top:1px solid rgba(74,103,65,.15); padding-top:24px; margin-top:20px }
    .sources-title { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--sage); margin-bottom:12px; font-weight:300 }
    .sources ul { list-style:none }
    .sources ul li { font-family:'Cormorant Garamond',serif; font-size:13px; font-style:italic; color:var(--earth); padding:5px 0; border-bottom:1px solid rgba(74,103,65,.06) }
    .sources ul li::before { content:'· '; color:var(--sage) }
    .nutrition-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:rgba(74,103,65,.12); border:1px solid rgba(74,103,65,.12); margin:20px 0 }
    .nutrition-cell { background:var(--cream); padding:22px 16px; text-align:center; transition:background .3s }
    .nutrition-cell:hover { background:var(--parchment) }
    .nutrition-num { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:300; color:var(--forest); line-height:1; margin-bottom:4px }
    .nutrition-unit { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:300 }
    .nutrition-label { font-size:11px; font-weight:300; color:var(--ink); margin-top:5px }
    footer { position:relative; z-index:10; text-align:center; padding:24px 20px 44px; border-top:1px solid rgba(74,103,65,.12); max-width:860px; margin:0 auto }
    footer p { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--sage); font-weight:300 }
    @keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
    @media(max-width:700px) {
      .hero-photos{grid-template-columns:1fr}.hero-photos img{height:260px}
      .benefits-grid{grid-template-columns:1fr}.nutrition-bar{grid-template-columns:1fr 1fr}
      .content{padding:0 18px 60px}
    }
  </style>
</head>
<body>

<button id="open3D">View in 3D</button>
<div id="viewerModal">
    <div id="modal-topbar">
      <span>3D Botanical Specimen — Neem</span>
      <button type="button" id="close3D" title="Close 3D View">✕</button>
    </div>
    <div class="modal-viewer-wrap">
      <div id="modelLoadingBadge" class="model-loading-overlay">
        <div class="model-loading-card">
          <div class="model-loading-spinner">✦</div>
          <div class="model-loading-title">Materializing 3D Neem</div>
          <div class="model-loading-sub">Loading geometry &amp; textures...</div>
          <div class="model-progress-bar-wrap">
            <div id="modelProgressBar" class="model-progress-bar"></div>
          </div>
        </div>
      </div>
      <model-viewer id="plantModelViewer" src="neem3d.glb" loading="eager" reveal="auto" auto-rotate camera-controls shadow-intensity="1" exposure="1"></model-viewer>
    </div>
  </div>
  <script>
    (function() {
      var open3D = document.getElementById('open3D');
      var close3D = document.getElementById('close3D');
      var modal = document.getElementById('viewerModal');
      var viewer = document.getElementById('plantModelViewer');
      var badge = document.getElementById('modelLoadingBadge');
      var pBar = document.getElementById('modelProgressBar');
      if (!open3D || !close3D || !modal) return;

      var _aud = document.getElementById('nimbaAudio');
      var isModelLoaded = false;

      function playAudioIfOpen() {
        if (_aud && (modal.classList.contains('is-open') || modal.style.display === 'flex')) {
          _aud.currentTime = 0;
          var p = _aud.play();
          if (p !== undefined) { p.catch(function(e) { console.log('Audio autoplay prevented:', e); }); }
        }
      }

      function onModelLoaded() {
        isModelLoaded = true;
        if (badge) badge.classList.add('is-hidden');
        if (pBar) pBar.style.width = '100%';
        playAudioIfOpen();
      }

      if (viewer) {
        if (viewer.loaded) {
          isModelLoaded = true;
          if (badge) badge.classList.add('is-hidden');
        } else {
          viewer.addEventListener('load', onModelLoaded);
          viewer.addEventListener('progress', function(evt) {
            if (evt.detail && evt.detail.totalProgress !== undefined) {
              var pct = Math.round(evt.detail.totalProgress * 100);
              if (pBar) pBar.style.width = Math.max(15, pct) + '%';
            }
          });
        }
      }

      function openModal() {
        modal.classList.add('is-open');
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';

        if (isModelLoaded || (viewer && viewer.loaded)) {
          if (badge) badge.classList.add('is-hidden');
          playAudioIfOpen();
        } else {
          if (_aud) { _aud.pause(); _aud.currentTime = 0; }
          if (badge) badge.classList.remove('is-hidden');
        }
      }

      function closeModal() {
        modal.classList.remove('is-open');
        modal.style.display = 'none';
        document.body.style.overflow = '';
        if (_aud) {
          _aud.pause();
          _aud.currentTime = 0;
        }
      }

      open3D.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation(); openModal();
      });
      close3D.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation(); closeModal();
      });
      modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && (modal.classList.contains('is-open') || modal.style.display === 'flex')) closeModal();
      });
    })();
  </script>

  <audio id="nimbaAudio" src="nimba_benefits.mp3" loop preload="auto"></audio>
</body>
</html>
