<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/Ayurvedha/">
<title>My Bookmarks — Swastha Herbal Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<style>
:root {
  --bg-primary: #07170F;
  --bg-secondary: #103B28;
  --botanical: #47734C;
  --gold: #C8A45D;
  --gold-warm: #E5C783;
  --ivory: #F5F0E4;
  --sage: #C7C9B9;

  /* Aliases */
  --cream: #07170F;
  --parchment: #103B28;
  --earth: #E5C783;
  --forest: #47734C;
  --deep: #F5F0E4;
  --ink: #F5F0E4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Jost', sans-serif;
  background-color: var(--bg-primary);
  color: var(--ivory);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 15%, rgba(16, 59, 40, 0.45) 0%, rgba(7, 23, 15, 0.9) 85%);
  pointer-events: none;
  z-index: 0;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.04; pointer-events: none; z-index: 100;
}

.bg-circle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.bg-circle-1 { width: 750px; height: 750px; background: radial-gradient(circle, rgba(71,115,76,0.18) 0%, transparent 70%); top: -200px; right: -150px; }
.bg-circle-2 { width: 550px; height: 550px; background: radial-gradient(circle, rgba(200,164,93,0.1) 0%, transparent 70%); bottom: -100px; left: -100px; }

.botanical-svg { position: fixed; pointer-events: none; z-index: 1; opacity: 0.18; }
.botanical-svg path { stroke: var(--botanical) !important; }
.botanical-svg ellipse { fill: var(--botanical) !important; }
.botanical-svg circle { fill: var(--gold) !important; }
.botanical-tl { top: -20px; left: -20px; width: 260px; }
.botanical-br { bottom: -20px; right: -20px; width: 220px; transform: rotate(180deg); }

/* ── HEADER ── */
header {
  position: relative; z-index: 10;
  padding: 54px 40px 0; text-align: center;
  opacity: 0; animation: fadeUp 0.9s ease 0.1s forwards;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1100px; margin: 0 auto 36px;
}
.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--sage); text-decoration: none; transition: color 0.3s;
}
.back-link:hover { color: var(--gold-warm); }

.user-info { display: flex; align-items: center; gap: 14px; }
.user-name {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--ivory); font-weight: 300;
}
.btn-signout {
  background: rgba(16, 59, 40, 0.35); border: 1px solid rgba(200, 164, 93, 0.35);
  color: var(--gold-warm); font-family: 'Jost', sans-serif;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  font-weight: 300; padding: 7px 16px; cursor: pointer; border-radius: 2px;
  transition: all 0.3s;
}
.btn-signout:hover { background: var(--gold); color: #07170F; border-color: var(--gold); }

.logo-rule { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; }
.logo-rule span { display: block; height: 1px; width: 70px; background: linear-gradient(to right, transparent, var(--gold)); }
.logo-rule span:last-child { background: linear-gradient(to left, transparent, var(--gold)); }
.logo-ornament { font-size: 13px; color: var(--gold-warm); }
h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(36px, 6vw, 64px); font-weight: 300; letter-spacing: 6px; color: var(--ivory); line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,0.5); }
h1 span { color: var(--gold-warm); }
.tagline { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; font-weight: 300; color: var(--gold-warm); letter-spacing: 2px; margin-top: 10px; }

/* ── DIVIDER ── */
.divider { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 48px auto 44px; }
.divider-line { height: 1px; width: 100px; background: linear-gradient(to right, transparent, var(--gold)); }
.divider-line:last-child { background: linear-gradient(to left, transparent, var(--gold)); }
.divider-leaf { color: var(--gold-warm); font-size: 16px; }

/* ── MAIN ── */
main {
  position: relative; z-index: 10;
  max-width: 1100px; margin: 0 auto;
  padding: 0 30px;
  opacity: 0; animation: fadeUp 0.9s ease 0.4s forwards;
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px; padding-bottom: 16px;
  border-bottom: 1px solid rgba(200, 164, 93, 0.2);
}
.stats-count {
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--sage); font-weight: 300;
}
.stats-count strong { color: var(--gold-warm); font-weight: 400; }
.section-label { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold-warm); font-weight: 300; }

/* ── LOADING ── */
.loading-state {
  text-align: center; padding: 80px 20px;
}
.loading-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
.loading-dots span {
  width: 7px; height: 7px; background: var(--gold-warm); border-radius: 50%;
  animation: blink 1.2s infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
.loading-text {
  font-family: 'Cormorant Garamond', serif; font-size: 18px;
  font-style: italic; color: var(--gold-warm); font-weight: 300;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 80px 20px; display: none;
}
.empty-state.visible { display: block; }
.empty-icon { font-size: 32px; color: var(--gold-warm); margin-bottom: 16px; opacity: 0.6; }
.empty-title {
  font-family: 'Cormorant Garamond', serif; font-size: 28px;
  font-style: italic; font-weight: 300; color: var(--ivory); margin-bottom: 8px;
}
.empty-sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--sage); margin-bottom: 28px; }
.btn-garden {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--gold); color: #07170F;
  border: 1px solid var(--gold); border-radius: 2px;
  text-decoration: none; font-family: 'Jost', sans-serif;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  font-weight: 400; padding: 14px 28px; transition: all 0.3s;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}
.btn-garden:hover { background: var(--gold-warm); border-color: var(--gold-warm); color: #07170F; box-shadow: 0 4px 22px rgba(200,164,93,0.35); }

/* ── BOOKMARKS GRID ── */
.bookmarks-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px; background: transparent; border: none;
}

/* ── BOOKMARK CARD ── */
.bm-card {
  background: rgba(16, 59, 40, 0.45);
  border: 1px solid rgba(200, 164, 93, 0.22);
  border-radius: 4px;
  padding: 40px 34px 36px;
  position: relative; overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  opacity: 0; animation: fadeUp 0.7s ease forwards;
}
.bm-card::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 70%, rgba(200, 164, 93, 0.08), transparent 65%);
  opacity: 0; transition: opacity 0.5s;
  pointer-events: none;
}
.bm-card:hover::after { opacity: 1; }
.bm-card:hover {
  background: rgba(16, 59, 40, 0.75);
  border-color: rgba(229, 199, 131, 0.5);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 20px rgba(200, 164, 93, 0.12);
}

.bm-number {
  font-family: 'Cormorant Garamond', serif; font-size: 11px;
  letter-spacing: 4px; color: var(--gold-warm); margin-bottom: 16px; display: block;
}
.bm-name {
  font-family: 'Cormorant Garamond', serif; font-size: 24px;
  font-weight: 400; color: var(--ivory); letter-spacing: 0.5px; margin-bottom: 4px;
  transition: color 0.3s;
}
.bm-card:hover .bm-name { color: var(--gold-warm); }
.bm-sci {
  font-family: 'Cormorant Garamond', serif; font-size: 13px;
  font-style: italic; font-weight: 300; color: var(--sage); margin-bottom: 18px;
}
.bm-sep { width: 32px; height: 1px; background: var(--gold); margin-bottom: 16px; transition: width 0.4s, background 0.4s; }
.bm-card:hover .bm-sep { width: 56px; background: var(--gold-warm); }
.bm-uses {
  font-size: 12px; font-weight: 300; letter-spacing: 0.5px;
  color: var(--ivory); line-height: 1.8; margin-bottom: 10px; opacity: 0.9;
}
.bm-uses strong {
  font-weight: 400; color: var(--gold-warm); font-size: 10px;
  letter-spacing: 2.5px; text-transform: uppercase; display: block; margin-bottom: 4px;
}
.bm-system {
  display: inline-block; font-size: 9px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--sage);
  background: rgba(71, 115, 76, 0.2);
  border: 1px solid rgba(71, 115, 76, 0.45); padding: 4px 12px; border-radius: 20px;
  margin-bottom: 18px;
}
.bm-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }
.bm-tag {
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--gold-warm); background: rgba(200, 164, 93, 0.1);
  border: 1px solid rgba(200, 164, 93, 0.28); padding: 3px 9px; border-radius: 20px;
}

.bm-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-view {
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none; background: var(--gold);
  border: 1px solid var(--gold); color: #07170F;
  font-family: 'Jost', sans-serif; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase; font-weight: 400;
  padding: 9px 18px; cursor: pointer; border-radius: 2px; transition: all 0.3s;
}
.btn-view:hover { background: var(--gold-warm); color: #07170F; border-color: var(--gold-warm); }
.btn-remove {
  background: none; border: 1px solid rgba(224, 108, 108, 0.35);
  color: rgba(224, 108, 108, 0.85); font-family: 'Jost', sans-serif;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  font-weight: 300; padding: 9px 16px; cursor: pointer; border-radius: 2px; transition: all 0.3s;
}
.btn-remove:hover { background: rgba(224, 108, 108, 0.15); border-color: #e06c6c; color: #e06c6c; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 40px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #103B28; border: 1px solid var(--gold); color: var(--ivory);
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  padding: 14px 28px; opacity: 0; transition: opacity 0.4s, transform 0.4s;
  z-index: 200; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── FOOTER ── */
footer {
  position: relative; z-index: 10; text-align: center;
  padding: 30px 20px 50px; margin-top: 60px;
  border-top: 1px solid rgba(200, 164, 93, 0.2);
  max-width: 1100px; margin-left: auto; margin-right: auto;
}
footer p { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--sage); font-weight: 300; }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }

@media (max-width: 900px) { .bookmarks-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 580px) { .bookmarks-grid { grid-template-columns: 1fr; } main { padding: 0 16px; } }
</style>
</head>

  'vacha':          { num:'24', name:'Vacha',          sci:'Acorus calamus',              system:'Ayurveda',                    uses:'Memory & speech enhancement, anticonvulsant, respiratory expectorant & Medhya Rasayana', tags:['Cognitive','Speech','Respiratory','Neural Support'],       href:'vacha.html' },
  'vidari-kanda':   { num:'25', name:'Vidari Kanda',   sci:'Pueraria tuberosa',          system:'Ayurveda',                    uses:'Reproductive tonic, galactagogue, cardioprotective & phytoestrogenic Vajikarana herb', tags:['Reproductive','Hormonal Balance','Heart Health'],           href:'vidari-kanda.html' },
  'yashtimadhu':    { num:'26', name:'Yashtimadhu',    sci:'Glycyrrhiza glabra',         system:'Ayurveda · Unani · TCM',      uses:'Gastric ulcer healing, respiratory soothing, Medhya Rasayana & adrenal support', tags:['Digestive','Respiratory','Cognitive','Anti-inflammatory'], href:'yashtimadhu.html' },
};

let currentUser = null;

// ── INIT ─────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }
  currentUser = session.user;
  const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
  document.getElementById('userName').textContent = name;
  await loadBookmarks();
})();

// ── LOAD BOOKMARKS ───────────────────────────────────────────────
async function loadBookmarks() {
  const { data, error } = await sb
    .from('bookmarks')
    .select('plant_key, created_at')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  document.getElementById('loadingState').style.display = 'none';

  if (error || !data || data.length === 0) {
    document.getElementById('emptyState').classList.add('visible');
    document.getElementById('bm-count').textContent = '0';
    return;
  }

  document.getElementById('bm-count').textContent = data.length;
  const grid = document.getElementById('bmGrid');
  grid.style.display = 'grid';

  data.forEach((row, idx) => {
    const p = PLANTS[row.plant_key];
    if (!p) return;
    const card = document.createElement('div');
    card.className = 'bm-card';
    card.style.animationDelay = `${0.1 + idx * 0.07}s`;
    card.innerHTML = `
      <span class="bm-number">${p.num}</span>
      <div class="bm-name">${p.name}</div>
      <div class="bm-sci">${p.sci}</div>
      <div class="bm-sep"></div>
      <div class="bm-uses"><strong>Uses</strong>${p.uses}</div>
      <span class="bm-system">${p.system}</span>
      <div class="bm-tags">${p.tags.map(t => `<span class="bm-tag">${t}</span>`).join('')}</div>
      <div class="bm-actions">
        <a href="${p.href}" class="btn-view">View Plant →</a>
        <button class="btn-remove" onclick="removeBookmark('${row.plant_key}', this)">✕ &nbsp;Remove</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── REMOVE BOOKMARK ──────────────────────────────────────────────
async function removeBookmark(plantKey, btn) {
  btn.disabled = true;
  btn.textContent = '…';

  const { error } = await sb
    .from('bookmarks')
    .delete()
    .eq('user_id', currentUser.id)
    .eq('plant_key', plantKey);

  if (error) {
    btn.disabled = false;
    btn.textContent = '✕  Remove';
    showToast('Failed to remove. Try again.');
    return;
  }

  // Remove card from DOM
  const card = btn.closest('.bm-card');
  card.style.transition = 'opacity 0.4s, transform 0.4s';
  card.style.opacity = '0';
  card.style.transform = 'translateY(-10px)';
  setTimeout(() => {
    card.remove();
    const remaining = document.querySelectorAll('.bm-card').length;
    document.getElementById('bm-count').textContent = remaining;
    if (remaining === 0) {
      document.getElementById('bmGrid').style.display = 'none';
      document.getElementById('emptyState').classList.add('visible');
    }
  }, 420);

  showToast('✦  Bookmark removed');
}

// ── SIGN OUT ─────────────────────────────────────────────────────
async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

// ── TOAST ────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
