<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swastha — Healing Paths</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<style>
:root {
  --bg-primary: #07170F;
  --bg-secondary: #103B28;
  --botanical: #47734C;
  --gold: #C8A45D;
  --gold-warm: #E5C783;
  --ivory: #F5F0E4;
  --sage: #C7C9B9;

  /* Theme tokens preserved for existing element selectors */
  --cream: #07170F;
  --parchment: #103B28;
  --earth: #E5C783;
  --forest: #47734C;
  --deep: #F5F0E4;
  --ink: #F5F0E4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Jost', sans-serif;
  color: var(--ivory);
  background-color: var(--bg-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;

  background-image: url("https://lh3.googleusercontent.com/d/1bObhspc9E3KncwN2GtaSPYF--h9Y9BpU");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(229, 199, 131, 0.24) 0%, rgba(16, 59, 40, 0.45) 40%, transparent 72%),
    radial-gradient(ellipse at 50% 25%, rgba(16, 59, 40, 0.72) 0%, rgba(7, 23, 15, 0.95) 85%);
  pointer-events: none;
  z-index: 0;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.04;
  pointer-events: none;
  z-index: 101;
}

.bg-circle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 1; }
.bg-circle-1 { width: 750px; height: 750px; background: radial-gradient(circle, rgba(71,115,76,0.2) 0%, transparent 70%); top: -200px; right: -150px; }
.bg-circle-2 { width: 550px; height: 550px; background: radial-gradient(circle, rgba(200,164,93,0.12) 0%, transparent 70%); bottom: -100px; left: -100px; }
.bg-circle-3 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(16,59,40,0.3) 0%, transparent 70%); top: 50%; left: 30%; }

/* Restrained golden atmospheric dust particles */
.dust-mote {
  position: fixed;
  border-radius: 50%;
  background: radial-gradient(circle, var(--gold-warm) 0%, rgba(200, 164, 93, 0) 70%);
  pointer-events: none;
  z-index: 2;
  opacity: 0.35;
  animation: floatDust infinite ease-in-out alternate;
}
.dust-1 { width: 4px; height: 4px; top: 22%; left: 18%; animation-duration: 9s; }
.dust-2 { width: 3px; height: 3px; top: 38%; right: 22%; animation-duration: 12s; animation-delay: 2s; }
.dust-3 { width: 5px; height: 5px; top: 65%; left: 28%; animation-duration: 15s; animation-delay: 4s; }
.dust-4 { width: 3px; height: 3px; top: 52%; right: 15%; animation-duration: 11s; animation-delay: 1s; }
.dust-5 { width: 4px; height: 4px; top: 15%; right: 35%; animation-duration: 14s; animation-delay: 3s; }

@keyframes floatDust {
  0% { transform: translateY(0) translateX(0); opacity: 0.2; }
  50% { opacity: 0.5; }
  100% { transform: translateY(-30px) translateX(15px); opacity: 0.15; }
}

.botanical-svg { position: fixed; pointer-events: none; z-index: 2; opacity: 0.22; }
.botanical-svg path { stroke: var(--botanical) !important; }
.botanical-svg ellipse { fill: var(--botanical) !important; }
.botanical-svg circle { fill: var(--gold) !important; }
.botanical-tl { top: -20px; left: -20px; width: 320px; transform: rotate(0deg); }
.botanical-br { bottom: -20px; right: -20px; width: 280px; transform: rotate(180deg); }

header { position: relative; z-index: 10; padding: 70px 40px 0; text-align: center; }

.logo-rule {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin-bottom: 16px; opacity: 0;
  animation: fadeUp 1s ease 0.1s forwards;
}
.logo-rule span { display: block; height: 1px; width: 80px; background: linear-gradient(to right, transparent, var(--gold)); }
.logo-rule span:last-child { background: linear-gradient(to left, transparent, var(--gold)); }
.logo-ornament { font-size: 14px; color: var(--gold-warm); letter-spacing: 4px; }

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(64px, 10vw, 110px);
  font-weight: 300; letter-spacing: 8px; line-height: 1;
  color: var(--ivory); opacity: 0; animation: fadeUp 1s ease 0.25s forwards;
  text-shadow: 0 4px 28px rgba(0,0,0,0.6);
}

.tagline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px; font-style: italic; font-weight: 300;
  color: var(--gold-warm); letter-spacing: 2.5px; margin-top: 10px;
  opacity: 0; animation: fadeUp 1s ease 0.4s forwards;
}

.devanagari {
  font-size: 13px; font-weight: 200; letter-spacing: 6px;
  color: var(--sage); margin-top: 8px;
  opacity: 0; animation: fadeUp 1s ease 0.55s forwards;
}

.divider {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin: 50px auto 60px;
  opacity: 0; animation: fadeUp 1s ease 0.65s forwards;
  position: relative; z-index: 10;
}
.divider-line { height: 1px; width: 120px; background: linear-gradient(to right, transparent, var(--gold)); }
.divider-line:last-child { background: linear-gradient(to left, transparent, var(--gold)); }
.divider-leaf { color: var(--gold-warm); font-size: 18px; }

.grid {
  position: relative; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 16px; max-width: 1140px; margin: 0 auto; padding: 0 30px 80px;
}

.path {
  position: relative; cursor: pointer;
  padding: 48px 20px 44px; text-align: center;
  border: 1px solid rgba(200, 164, 93, 0.28);
  border-radius: 8px;
  background: linear-gradient(180deg, rgba(16, 59, 40, 0.48) 0%, rgba(7, 23, 15, 0.65) 100%);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(229, 199, 131, 0.18);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  opacity: 0; animation: fadeUp 0.9s ease forwards;
  overflow: hidden;
}

.path:nth-child(1) { animation-delay: 0.5s; }
.path:nth-child(2) { animation-delay: 0.65s; overflow: visible !important; z-index: 4; padding-top: 64px; }
.path:nth-child(3) { animation-delay: 0.8s; overflow: visible !important; z-index: 4; padding-top: 64px; }
.path:nth-child(4) { animation-delay: 0.95s; padding-top: 64px; z-index: 5; overflow: visible !important; }
.path:nth-child(5) { animation-delay: 1.1s; overflow: visible !important; z-index: 4; padding-top: 64px; }

/* Ayurveda path also needs overflow visible for burst-out effect */
.path:nth-child(1) { overflow: visible !important; z-index: 4; padding-top: 64px; }

.path:hover {
  background: linear-gradient(180deg, rgba(16, 59, 40, 0.78) 0%, rgba(7, 23, 15, 0.88) 100%);
  border-color: rgba(229, 199, 131, 0.65);
  transform: translateY(-6px);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6), 0 0 28px rgba(200, 164, 93, 0.22), inset 0 1px 0 rgba(229, 199, 131, 0.35);
}

.path::before {
  content: ''; position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 2px;
  background: linear-gradient(to right, transparent, var(--gold-warm), transparent);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.path:hover::before { width: 75%; }

.path::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 80%, rgba(200, 164, 93, 0.12) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.5s ease;
}
.path:hover::after { opacity: 1; }

.path-number {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; font-weight: 400; letter-spacing: 4px;
  color: var(--gold-warm); margin-bottom: 28px; display: block;
}

/* ── ICON CIRCLE ── */
.path-icon {
  width: 78px; height: 78px;
  border-radius: 50%;
  border: 1px solid rgba(200, 164, 93, 0.4);
  margin: 0 auto 24px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden; /* clips image neatly to circle */
  transition: border-color 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  background: rgba(7, 23, 15, 0.75);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
}
.path:hover .path-icon {
  border-color: var(--gold-warm);
  transform: scale(1.08);
  box-shadow: 0 0 20px rgba(200, 164, 93, 0.28);
}

/* Yoga-specific size match to Ayurveda */
.path:nth-child(2) .path-icon--transparent img {
  width: 170px !important;
  height: 170px !important;
  bottom: -40px !important;
}

/* Homeopathy-specific size match to Ayurveda */
.path:nth-child(5) .path-icon--transparent img {
  width: 170px !important;
  height: 170px !important;
  bottom: -40px !important;
}

/* Siddha-specific size match to Ayurveda */
.path:nth-child(4) .path-icon--transparent img {
  width: 170px !important;
  height: 170px !important;
  bottom: -40px !important;
}

/* Unani-specific size match to Ayurveda */
.path:nth-child(3) .path-icon--transparent img {
  width: 170px !important;
  height: 170px !important;
  bottom: -40px !important;
}

/* Transparent variant — 3D burst-out effect */
.path-icon--transparent {
  background: transparent !important;
  border-color: transparent !important;
  overflow: visible !important;
  z-index: 5;
}

/* Image bursts OUT of the circle — bottom overflows for 3D feel */
.path-icon--transparent img {
  width: 130px !important;
  height: 130px !important;
  object-fit: contain !important;
  position: absolute !important;
  bottom: -28px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  border-radius: 0 !important;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)) drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  z-index: 20;
  transition: transform 0.4s ease, filter 0.4s ease !important;
}
.path:hover .path-icon--transparent img {
  transform: translateX(-50%) translateY(-8px) scale(1.07) !important;
  filter: drop-shadow(0 18px 28px rgba(0,0,0,0.6)) drop-shadow(0 6px 12px rgba(200,164,93,0.25));
}

/* Image fills entire circle, no gaps */
.path-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  border-radius: 50%;
}

.path-icon::before {
  content: ''; position: absolute; inset: -8px;
  border-radius: 50%;
  border: 1px dashed rgba(200, 164, 93, 0.45);
  transition: opacity 0.4s;
  animation: spinSlow 20s linear infinite;
  opacity: 0; z-index: 2;
}
.path:hover .path-icon::before { opacity: 1; }

@keyframes spinSlow {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.path-symbol {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px; font-weight: 600;
  color: var(--gold-warm); line-height: 1;
  transition: color 0.3s ease;
}
.path:hover .path-symbol { color: var(--ivory); }

.path-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; font-weight: 400; letter-spacing: 1.5px;
  color: var(--ivory); margin-bottom: 10px; transition: color 0.3s;
}
.path:hover .path-name { color: var(--gold-warm); }

.path-sub {
  font-size: 10px; font-weight: 300; letter-spacing: 3px;
  text-transform: uppercase; color: var(--sage); line-height: 1.6;
}

.path-arrow {
  display: inline-block; margin-top: 22px;
  font-size: 18px; color: var(--gold);
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease, color 0.3s ease;
}
.path:hover .path-arrow { opacity: 1; transform: translateY(0); color: var(--gold-warm); }

footer {
  position: relative; z-index: 10; text-align: center;
  padding: 40px 20px 60px;
  border-top: 1px solid rgba(200, 164, 93, 0.22);
  max-width: 1000px; margin: 40px auto 0;
}
footer p { font-size: 11.5px; letter-spacing: 5px; text-transform: uppercase; color: var(--sage); font-weight: 300; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(3, 1fr); max-width: 600px; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr 1fr; max-width: 380px; gap: 12px; }
  h1 { letter-spacing: 4px; }
}

/* ==================== INTRO VIDEO EXPERIENCE ==================== */
.intro-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  min-height: 100dvh;
  z-index: 999999;
  background: #0d1712;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
              visibility 0.85s ease;
}

.intro-logo-container {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
              opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
              filter 0.85s ease;
}

.intro-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  width: 100dvw;
  height: 100dvh;
  object-fit: cover;
  pointer-events: none;
  display: block;
}

.intro-controls {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* Positioned directly over the watermark/logo to completely cover it */
.intro-sound-button {
  position: absolute;
  z-index: 20;
  bottom: max(96px, env(safe-area-inset-bottom, 96px));
  right: max(32px, env(safe-area-inset-right, 32px));
  min-width: 230px;
  min-height: 66px;
  padding: 18px 34px;
  background: #091a12;
  background: linear-gradient(135deg, rgba(16, 59, 40, 0.98), rgba(7, 23, 15, 0.98));
  border: 1px solid rgba(229, 199, 131, 0.75);
  border-radius: 9999px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--ivory);
  font: 500 1rem 'Jost', sans-serif;
  letter-spacing: 0.8px;
  cursor: pointer;
  pointer-events: auto;
  box-shadow: 0 0 0 16px rgba(7, 23, 15, 0.96),
              0 0 45px 30px rgba(7, 23, 15, 0.95),
              0 12px 35px rgba(0, 0, 0, 0.85);
  transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  user-select: none;
}

.intro-sound-button:hover {
  background: linear-gradient(135deg, rgba(20, 72, 49, 1), rgba(16, 59, 40, 1));
  border-color: var(--gold-warm);
  color: #ffffff;
  transform: translateY(-2px);
  box-shadow: 0 0 0 18px rgba(7, 23, 15, 0.98),
              0 0 50px 35px rgba(7, 23, 15, 0.98),
              0 16px 40px rgba(0, 0, 0, 0.9);
}

.intro-sound-button.active {
  background: linear-gradient(135deg, rgba(20, 72, 49, 0.98), rgba(16, 59, 40, 0.98));
  border-color: var(--gold-warm);
  color: var(--ivory);
}

.intro-skip-button {
  position: absolute;
  z-index: 10;
  top: max(24px, env(safe-area-inset-top, 24px));
  right: max(24px, env(safe-area-inset-right, 24px));
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 9999px;
  padding: 8px 18px;
  background: rgba(13, 23, 18, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #ede4d0;
  font: 300 0.85rem 'Jost', sans-serif;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: auto;
  box-shadow: 0 2px 14px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
}

.intro-skip-button:hover {
  background: rgba(201, 168, 76, 0.25);
  border-color: var(--gold);
  color: #ffffff;
}

.intro-overlay.intro-exit {
  opacity: 0;
  pointer-events: none;
}

.intro-overlay.intro-exit .intro-logo-container {
  transform: scale(1.05);
  opacity: 0;
  filter: blur(16px);
}
</style>
</head>

<script>
(function() {
  const introOverlay = document.getElementById('intro-overlay');
  const introVideo = document.getElementById('intro-video');
  const soundButton = document.getElementById('intro-sound-button');
  const skipButton = document.getElementById('intro-skip-button');
  let isFinished = false;
  let introTimeout;

  function lockScroll() {
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    document.body.style.touchAction = 'none';
  }

  function unlockScroll() {
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    document.body.style.touchAction = '';
  }

  function finishIntro() {
    if (isFinished) return;
    isFinished = true;
    clearTimeout(introTimeout);
    introOverlay.classList.add('intro-exit');
    setTimeout(() => {
      introOverlay.style.display = 'none';
      if (introVideo) {
        introVideo.pause();
      }
      unlockScroll();
    }, 850);
  }

  function scheduleSafetyTimeout() {
    clearTimeout(introTimeout);
    let duration = 10;
    if (introVideo && introVideo.duration && isFinite(introVideo.duration)) {
      duration = introVideo.duration;
    }
    introTimeout = setTimeout(finishIntro, Math.ceil((duration + 1) * 1000));
  }

  function alignSoundButtonWithWatermark() {
    if (!introVideo || !soundButton) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const videoRatio = 1920 / 1080;
    const screenRatio = vw / vh;

    let renderedW, renderedH, offsetX, offsetY;
    if (screenRatio > videoRatio) {
      // Screen is wider than 16:9 - video cropped vertically (top & bottom)
      renderedW = vw;
      renderedH = vw / videoRatio;
      offsetX = 0;
      offsetY = (vh - renderedH) / 2;
    } else {
      // Screen is narrower/taller than 16:9 - video cropped horizontally (left & right)
      renderedH = vh;
      renderedW = vh * videoRatio;
      offsetX = (vw - renderedW) / 2;
      offsetY = 0;
    }

    // Watermark center in 1920x1080 video: X = 1740, Y = 888
    const watermarkX = offsetX + (renderedW * (1740 / 1920));
    const watermarkY = offsetY + (renderedH * (888 / 1080));

    const distFromRight = vw - watermarkX;
    const distFromBottom = vh - watermarkY;

    const btnW = soundButton.offsetWidth || 230;
    const btnH = soundButton.offsetHeight || 66;

    // Center the audio button precisely over the watermark center
    const targetRight = Math.max(16, Math.min(vw - btnW - 16, Math.round(distFromRight - (btnW / 2))));
    const targetBottom = Math.max(16, Math.min(vh - btnH - 16, Math.round(distFromBottom - (btnH / 2))));

    soundButton.style.right = targetRight + 'px';
    soundButton.style.bottom = targetBottom + 'px';
  }

  window.addEventListener('resize', alignSoundButtonWithWatermark);
  window.addEventListener('orientationchange', alignSoundButtonWithWatermark);

  function startIntro() {
    isFinished = false;
    introOverlay.style.display = 'flex';
    introOverlay.classList.remove('intro-exit');
    lockScroll();
    alignSoundButtonWithWatermark();
    requestAnimationFrame(alignSoundButtonWithWatermark);

    if (introVideo) {
      introVideo.currentTime = 0;
      introVideo.muted = false;
      const playPromise = introVideo.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          if (soundButton) {
            soundButton.innerHTML = '🔊 Audio: On';
            soundButton.classList.add('active');
          }
        }).catch(() => {
          if (!isFinished) {
            introVideo.muted = true;
            if (soundButton) {
              soundButton.innerHTML = '🔊 Enable Audio';
              soundButton.classList.remove('active');
            }
            const mutedPlayPromise = introVideo.play();
            if (mutedPlayPromise !== undefined) {
              mutedPlayPromise.catch((mutedErr) => {
                if (!isFinished) {
                  console.error('Intro video could not play:', mutedErr);
                  finishIntro();
                }
              });
            }
          }
        });
      }
    }
    scheduleSafetyTimeout();
  }

  if (skipButton) {
    skipButton.addEventListener('click', (event) => {
      event.stopPropagation();
      finishIntro();
    });
  }

  if (introOverlay) {
    introOverlay.addEventListener('click', (event) => {
      // Allow clicking anywhere outside control buttons to skip
      if (!event.target.closest('button')) {
        finishIntro();
      }
    });
  }

  if (soundButton && introVideo) {
    soundButton.addEventListener('click', (event) => {
      event.stopPropagation();
      if (introVideo.muted) {
        introVideo.muted = false;
        soundButton.innerHTML = '🔊 Audio: On';
        soundButton.classList.add('active');
        const playPromise = introVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch((err) => {
            console.error('Intro video sound could not be enabled:', err);
          });
        }
      } else {
        introVideo.muted = true;
        soundButton.innerHTML = '🔇 Enable Audio';
        soundButton.classList.remove('active');
      }
    });
  }

  if (introVideo) {
    introVideo.addEventListener('loadedmetadata', () => {
      scheduleSafetyTimeout();
      alignSoundButtonWithWatermark();
    });
    introVideo.addEventListener('canplay', alignSoundButtonWithWatermark);
    introVideo.addEventListener('ended', () => {
      finishIntro();
    });
    introVideo.addEventListener('error', () => {
      console.error('Intro video could not be loaded.');
      finishIntro();
    });
  }

  // Prevent scroll propagation on touch devices during intro
  const preventScroll = (e) => {
    if (!isFinished && introOverlay.style.display !== 'none') {
      if (!e.target.closest('button')) {
        if (e.cancelable) e.preventDefault();
      }
    }
  };
  window.addEventListener('touchmove', preventScroll, { passive: false });

  // Escape, Enter or Space skips the intro
  window.addEventListener('keydown', (e) => {
    if (!isFinished && introOverlay && introOverlay.style.display !== 'none') {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        finishIntro();
      }
    }
  });

  // Initial startup
  lockScroll();
  startIntro();
})();
</script>
